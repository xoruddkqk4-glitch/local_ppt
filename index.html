<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local ppt</title><link rel="preconnect" href="https://cdn.jsdelivr.net"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><link rel="stylesheet" href="style.css"></head><body data-design="bauhaus"><header class="app-header"><a class="brand" href="#">LOCAL PPT</a><p>LOCAL PRESENTATION STUDIO</p><div><button id="addPageButton">+ 페이지</button><button id="fullscreenButton">전체 화면 <kbd>F</kbd></button></div></header><main class="workspace"><aside class="editor-panel"><section class="panel-section"><div class="section-heading"><span>01</span><h1>디자인 선택</h1></div><label class="select-label">프레젠테이션 스타일<select id="designSelect"><option value="bauhaus">Bauhaus</option><option value="glass">Glassmorphism</option><option value="clay">Claymorphism</option><option value="brutal">Neo-Brutalism</option><option value="skeuo">Skeuomorphism</option></select></label><p id="designHint" class="guide"></p></section><section class="panel-section"><div class="section-heading"><span>02</span><h2>템플릿 선택</h2></div><label class="select-label">레이아웃 템플릿<select id="templateSelect"><option value="">템플릿을 선택하세요</option><option value="mindmap">마인드맵</option><option value="bullet">개조식</option><option value="table">테이블</option></select></label></section><section id="contentEditor" class="panel-section is-disabled"><div class="section-heading"><span>03</span><h2>내용 입력</h2></div><p id="templateHint" class="guide">템플릿을 선택하면 입력 필드가 열립니다.</p><div id="inputFields"></div><div id="contentActions"></div><label class="image-upload">이미지 첨부<input id="imageInput" type="file" accept="image/*"><strong>이미지 선택</strong></label><p id="imageInfo" class="guide">첨부된 이미지 없음</p></section></aside><section class="stage-panel"><div class="stage-toolbar"><div id="pageList" class="page-list"></div><span>개체를 마우스로 드래그하여 이동 · 우하단 핸들로 크기 조절</span></div><div id="presentationStage" class="presentation-stage" tabindex="0"></div></section></main><template id="emptyStageTemplate"><div class="empty-stage"><h2>템플릿을<br>선택하세요.</h2><p>왼쪽 패널에서 시작합니다.</p></div></template><script src="templates/schema.js"></script><script src="designs/options.js"></script><script src="app.js"></script></body></html>
